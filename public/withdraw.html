<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Withdraw</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        /* ===================== GLOBAL ===================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: Arial, sans-serif;
            color: #fff;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #050508;
            background-image: url('/background.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at top center, rgba(229,9,20,0.16), transparent 55%);
            pointer-events: none;
            z-index: -1;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.75), transparent 30%);
            pointer-events: none;
            z-index: -1;
        }
        * { scrollbar-width: thin; scrollbar-color: rgba(229,9,20,0.3) transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; border-radius: 10px; margin: 4px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, rgba(229,9,20,0.4), rgba(255,122,0,0.4)); border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }
        ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, rgba(229,9,20,0.7), rgba(255,122,0,0.7)); }

        /* Remove blue focus outline */
        *:focus {
            outline: none !important;
            box-shadow: none !important;
        }

        /* ===================== LOADING OVERLAY ===================== */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 15px;
        }
        .loader {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #e67e22;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #loadingOverlay p {
            color: #ccc;
            font-size: 16px;
        }

        /* ===================== HEADER ===================== */
        .nf-header {
            flex-shrink: 0;
            z-index: 1000;
            background: rgba(10,10,10,.7);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,.08);
            box-shadow: 0 10px 30px rgba(0,0,0,.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            position: relative;
        }
        .header-left { display: flex; align-items: center; gap: 6px; }
        .header-icon-btn {
            width: 38px; height: 38px; border: none; background: rgba(255,255,255,.04); color: #fff; cursor: pointer;
            display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: all .2s; text-decoration: none;
            flex-shrink: 0; border: 1px solid rgba(255,255,255,.06);
        }
        .header-icon-btn:hover { background: rgba(255,255,255,.12); transform: scale(1.05); border-color: rgba(255,255,255,.15); }
        .header-icon-btn .material-icons { font-size: 22px; opacity: .85; }
        .header-balance {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 1.2em;
            font-weight: bold;
            color: #f1c40f;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid rgba(241,196,15,0.3);
        }
        .header-balance img {
            width: 24px;
            height: 24px;
        }

        /* ===================== MAIN CONTAINER ===================== */
        .container {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            max-width: 500px;
            width: 100%;
            margin: 20px auto;
            padding: 20px;
            overflow: hidden;
        }
        .withdraw-card {
            background: rgba(17,17,17,0.85);
            border: 1px solid #2a2a2a;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.8);
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .withdraw-title {
            text-align: center;
            font-size: 2em;
            font-weight: 900;
            color: #f1c40f;
            text-shadow: 0 0 20px rgba(241,196,15,0.5);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #ddd;
            font-weight: bold;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #1a1a1a;
            color: #fff;
            font-size: 1em;
        }
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(145deg, #e67e22, #d35400);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(230,126,34,0.5);
        }
        .btn-submit:disabled {
            background: #333;
            cursor: not-allowed;
            box-shadow: none;
        }
        .message {
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
            color: #2ecc71;
        }
    </style>
</head>
<body>
    <!-- ===================== LOADING OVERLAY ===================== -->
    <div id="loadingOverlay">
        <div class="loader"></div>
        <p>Loading…</p>
    </div>

    <!-- ===================== HEADER ===================== -->
    <header class="nf-header" style="display:none;">
        <div class="header-left">
            <a href="index.html" class="header-icon-btn">
                <span class="material-icons">arrow_back</span>
            </a>
        </div>
        <div class="header-balance">
            <img src="/coin.png" alt="Coin">
            <span id="balanceValue">0</span>
        </div>
    </header>

    <!-- ===================== MAIN CONTENT ===================== -->
    <div class="container" style="display:none;" id="mainContainer">
        <div class="withdraw-card">
            <div class="withdraw-title">💰 Withdraw</div>
            <div class="form-group">
                <label>Available Balance</label>
                <input type="text" id="availableBalance" disabled value="0">
            </div>
            <div class="form-group">
                <label>Amount to Withdraw</label>
                <input type="number" id="withdrawAmount" min="1" placeholder="Enter amount">
            </div>
            <div class="form-group">
                <label>Payment Method</label>
                <select id="paymentMethod">
                    <option value="gcash">GCash</option>
                    <option value="paymaya">PayMaya</option>
                    <option value="bank">Bank Transfer</option>
                </select>
            </div>
            <div class="form-group">
                <label>Account Details</label>
                <input type="text" id="accountDetails" placeholder="Account number / name">
            </div>
            <button class="btn-submit" id="submitBtn">Submit Request</button>
            <div class="message" id="message"></div>
        </div>
    </div>

    <script>
        (async () => {
            const loadingOverlay = document.getElementById('loadingOverlay');
            try {
                const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js");
                const { getAuth, onAuthStateChanged, signOut } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js");
                const { getFirestore, doc, getDoc, addDoc, collection, serverTimestamp, updateDoc } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js");

                const firebaseConfig = {
                    apiKey: "AIzaSyAzjmVZUTLMeX1R-W2V86RBKrKP6bgl6iU",
                    authDomain: "yourtv-c12eb.firebaseapp.com",
                    projectId: "yourtv-c12eb",
                    storageBucket: "yourtv-c1eb.firebasestorage.app",
                    messagingSenderId: "28690991912",
                    appId: "1:28690991912:web:3cbc631ba0201b7caede1d",
                    measurementId: "G-CC7DLZS0NB"
                };

                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);

                let currentUser = null;

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        currentUser = user;
                        loadingOverlay.style.display = 'none';
                        document.querySelector('.nf-header').style.display = 'flex';
                        document.getElementById('mainContainer').style.display = 'flex';
                        await loadBalance();
                    } else {
                        window.location.href = 'login.html';
                    }
                });

                async function loadBalance() {
                    const userRef = doc(db, "users", currentUser.uid);
                    const userSnap = await getDoc(userRef);
                    if (userSnap.exists()) {
                        const coins = userSnap.data().coins || 0;
                        document.getElementById('balanceValue').textContent = coins;
                        document.getElementById('availableBalance').value = coins;
                    } else {
                        document.getElementById('balanceValue').textContent = '0';
                        document.getElementById('availableBalance').value = '0';
                    }
                }

                document.getElementById('submitBtn').addEventListener('click', async () => {
                    const amount = parseInt(document.getElementById('withdrawAmount').value);
                    const paymentMethod = document.getElementById('paymentMethod').value;
                    const accountDetails = document.getElementById('accountDetails').value.trim();
                    const available = parseInt(document.getElementById('availableBalance').value);

                    if (!amount || amount <= 0) {
                        document.getElementById('message').textContent = 'Please enter a valid amount.';
                        return;
                    }
                    if (amount > available) {
                        document.getElementById('message').textContent = 'Insufficient balance.';
                        return;
                    }
                    if (!accountDetails) {
                        document.getElementById('message').textContent = 'Please enter account details.';
                        return;
                    }

                    // Disable button to prevent double submission
                    document.getElementById('submitBtn').disabled = true;

                    try {
                        // Add withdrawal request
                        await addDoc(collection(db, "withdrawals"), {
                            userId: currentUser.uid,
                            amount: amount,
                            paymentMethod: paymentMethod,
                            accountDetails: accountDetails,
                            status: 'pending',
                            createdAt: serverTimestamp()
                        });

                        // Deduct amount from user's coins
                        const userRef = doc(db, "users", currentUser.uid);
                        const newBalance = available - amount;
                        await updateDoc(userRef, { coins: newBalance });

                        // Update UI
                        document.getElementById('balanceValue').textContent = newBalance;
                        document.getElementById('availableBalance').value = newBalance;
                        document.getElementById('withdrawAmount').value = '';
                        document.getElementById('accountDetails').value = '';
                        document.getElementById('message').textContent = 'Withdrawal request submitted successfully!';
                    } catch (err) {
                        console.error(err);
                        document.getElementById('message').textContent = 'Error submitting request.';
                    }

                    document.getElementById('submitBtn').disabled = false;
                });

            } catch (err) {
                console.error('Failed to load Firebase:', err);
                loadingOverlay.innerHTML = '<p style="color:red;">Error loading page. Please refresh.</p>';
            }
        })();
    </script>
</body>
</html>
