<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Animal Slots</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        /* ===================== GLOBAL ===================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: Arial, sans-serif;
            color: #fff;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #050508;
            background-image: url('/background.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at top center, rgba(229,9,20,0.16), transparent 55%);
            pointer-events: none;
            z-index: -1;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.75), transparent 30%);
            pointer-events: none;
            z-index: -1;
        }
        * { scrollbar-width: thin; scrollbar-color: rgba(229,9,20,0.3) transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; border-radius: 10px; margin: 4px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, rgba(229,9,20,0.4), rgba(255,122,0,0.4)); border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }
        ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, rgba(229,9,20,0.7), rgba(255,122,0,0.7)); }

        /* Remove blue focus outline */
        *:focus {
            outline: none !important;
            box-shadow: none !important;
        }

        /* ===================== LOADING OVERLAY ===================== */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 15px;
        }
        .loader {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #e67e22;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #loadingOverlay p {
            color: #ccc;
            font-size: 16px;
        }

        /* ===================== START SCREEN ===================== */
        #startScreen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #000, #1a1a1a);
            text-align: center;
            padding: 20px;
        }
        #startScreen h1 {
            font-size: 2.5em;
            color: #f1c40f;
            text-shadow: 0 0 20px rgba(241,196,15,0.8);
            margin-bottom: 20px;
        }
        #startScreen p {
            font-size: 1.2em;
            color: #ccc;
            margin-bottom: 40px;
        }
        #startBtn {
            background: #e67e22;
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 1.5em;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 2px;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(230,126,34,0.6);
        }
        #startBtn:hover { background: #f39c12; transform: scale(1.05); }
        #startBtn:active { transform: scale(0.95); }

        /* ===================== HEADER ===================== */
        .nf-header {
            flex-shrink: 0;
            z-index: 1000;
            background: rgba(10,10,10,.7);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,.08);
            box-shadow: 0 10px 30px rgba(0,0,0,.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            position: relative;
        }
        .header-left { display: flex; align-items: center; gap: 6px; }
        .header-icon-btn {
            width: 38px; height: 38px; border: none; background: rgba(255,255,255,.04); color: #fff; cursor: pointer;
            display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: all .2s; text-decoration: none;
            flex-shrink: 0; border: 1px solid rgba(255,255,255,.06);
        }
        .header-icon-btn:hover { background: rgba(255,255,255,.12); transform: scale(1.05); border-color: rgba(255,255,255,.15); }
        .header-icon-btn .material-icons { font-size: 22px; opacity: .85; }
        .header-balance {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 1.2em;
            font-weight: bold;
            color: #f1c40f;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid rgba(241,196,15,0.3);
        }
        .header-balance img {
            width: 24px;
            height: 24px;
        }
        .dropdown-menu {
            position: absolute;
            top: 55px;
            left: 10px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            min-width: 150px;
            overflow: hidden;
            display: none;
            z-index: 1001;
        }
        .dropdown-item {
            display: block;
            padding: 12px 20px;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9em;
            border-bottom: 1px solid #333;
            transition: background 0.2s;
            cursor: pointer;
        }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover { background: #e50914; }

        /* ===================== MAIN GAME LAYOUT ===================== */
        .container {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            overflow: hidden;
        }
        .main-card {
            flex: 1;
            min-height: 0;
            background: rgba(17,17,17,0.85);
            border: 1px solid #2a2a2a;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Premium header container */
        .premium-header {
            background: linear-gradient(145deg, rgba(30,30,30,0.9), rgba(10,10,10,0.95));
            border: 1px solid rgba(201,168,76,0.4);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(201,168,76,0.2), inset 0 0 10px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }
        .slot-title {
            text-align: center;
            font-size: 2em;
            font-weight: 900;
            color: #f1c40f;
            text-shadow: 0 0 20px rgba(241,196,15,0.5);
            margin-bottom: 10px;
        }
        .multiplier-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .mult-badge {
            background: #2a2a2a;
            color: #aaa;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s;
            cursor: default;
            border: 1px solid #444;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }
        .mult-badge.active {
            background: linear-gradient(145deg, #e67e22, #f39c12);
            color: #fff;
            border-color: #f39c12;
            animation: multPulse 1s infinite alternate;
            box-shadow: 0 0 15px rgba(230,126,34,0.7), inset 0 0 5px rgba(255,255,255,0.2);
        }
        @keyframes multPulse { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* Reels container */
        .reels-container {
            flex: 0 0 auto;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 0 0 20px 0;
            padding: 10px;
            border-radius: 20px;
            background: linear-gradient(145deg, #0a0a1a, #111);
            border: 3px solid #c9a84c;
            box-shadow: 0 0 30px rgba(201,168,76,0.4), inset 0 0 15px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        .reel-column { flex-shrink: 0; overflow: hidden; position: relative; border-radius: 10px; background: #111; box-shadow: 0 0 10px rgba(0,0,0,0.5), 0 0 6px rgba(201,168,76,0.2); contain: strict; border: 1px solid rgba(201,168,76,0.4); }
        .reel-strip { position: absolute; top: 0; left: 0; width: 100%; will-change: transform; backface-visibility: hidden; transform: translateZ(0); }
        .reel-cell { display: flex; align-items: center; justify-content: center; border-bottom: 1px solid rgba(201,168,76,0.3); background: #1a1a1a; user-select: none; padding: 5px; transition: background 0.3s; }
        .reel-cell img { width: 100%; height: 100%; object-fit: contain; border-radius: 3px; filter: brightness(0.95); draggable: false; }

        .reel-cell.win {
            background: #ffd700;
            background: radial-gradient(circle at 50% 50%, #ffd700, #b8860b);
            animation: winBounce 0.6s ease-in-out infinite alternate, shimmer 1.5s linear infinite;
            box-shadow: 0 0 15px #f1c40f, inset 0 0 10px rgba(255,255,255,0.8);
            position: relative;
            overflow: hidden;
        }
        .reel-cell.win img {
            filter: brightness(1.5) drop-shadow(0 0 5px gold);
            animation: imgPulse 0.6s ease-in-out infinite alternate;
        }
        @keyframes winBounce { 0% { transform: translateY(0); } 100% { transform: translateY(-10px); } }
        @keyframes imgPulse { 0% { transform: scale(1); } 100% { transform: scale(1.2); } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .reel-cell.win::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            background-size: 200% 100%;
            animation: shimmer 1.5s linear infinite;
            pointer-events: none;
        }

        .reel-column.stopping { animation: hardStop 0.15s ease-out; }
        @keyframes hardStop { 0% { transform: translateY(0); } 30% { transform: translateY(-12px); } 60% { transform: translateY(5px); } 100% { transform: translateY(0); } }

        /* Premium footer container */
        .premium-footer {
            background: linear-gradient(145deg, rgba(30,30,30,0.9), rgba(10,10,10,0.95));
            border: 1px solid rgba(201,168,76,0.4);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(201,168,76,0.2), inset 0 0 10px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }
        .button-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }
        .button-left {
            display: flex;
            gap: 10px;
            flex: 1;
            justify-content: flex-start;
        }
        .button-center {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
        }
        .button-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            justify-content: flex-end;
        }
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.2s;
            color: #fff;
            letter-spacing: 1px;
            white-space: nowrap;
            background: linear-gradient(145deg, #2c3e50, #1a252f);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { background: #333 !important; cursor: not-allowed; box-shadow: none; }
        .btn-spin {
            background: linear-gradient(145deg, #e67e22, #d35400);
            font-size: 1.3em;
            text-shadow: 1px 1px 0 #b85e00;
            padding: 20px 40px;
            box-shadow: 0 0 25px rgba(230,126,34,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .btn-auto { background: linear-gradient(145deg, #1a5276, #154360); }
        .btn-stop { background: linear-gradient(145deg, #c0392b, #922b21); }

        .bet-label { font-size: 1em; font-weight: bold; color: #ddd; }
        .custom-bet-dropdown {
            position: relative;
            display: inline-block;
        }
        .bet-display {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #1a1a1a;
            border: 1px solid rgba(201,168,76,0.5);
            border-radius: 25px;
            padding: 12px 20px;
            color: #f1c40f;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
            transition: all 0.2s;
        }
        .bet-display:hover {
            border-color: #f39c12;
            box-shadow: 0 0 10px rgba(230,126,34,0.7);
        }
        .bet-display .material-icons {
            font-size: 22px;
        }
        .bet-options {
            position: absolute;
            bottom: 55px;
            right: 0;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            min-width: 100px;
            overflow: hidden;
            display: none;
            z-index: 1002;
        }
        .bet-option {
            padding: 10px 20px;
            color: #fff;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            border-bottom: 1px solid #333;
            transition: background 0.2s;
        }
        .bet-option:last-child { border-bottom: none; }
        .bet-option:hover { background: #e67e22; }
        .bet-option.selected { background: #e67e22; color: #fff; }

        .message { min-height: 40px; font-size: 1.1em; margin: 10px 0; font-weight: bold; color: #fff; text-align: center; flex-shrink: 0; }
        .free-spins-msg { color: #2ecc71; font-size: 1em; min-height: 25px; text-align: center; flex-shrink: 0; }

        /* ===================== COIN CONFETTI (using coin.png) ===================== */
        #confetti-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2000;   /* above header */
        }
        .coin {
            position: absolute;
            background-image: url('/coin.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            animation: coin-fall linear forwards;
        }
        @keyframes coin-fall {
            0% { transform: translateY(-100%) rotateZ(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotateZ(720deg); opacity: 0; }
        }

        /* ===================== DESKTOP SPECIFIC ===================== */
        @media (min-width: 1024px) {
            .container {
                padding: 30px;
                max-width: 900px;
            }
            .main-card {
                padding: 25px;
                border-radius: 24px;
            }
            .premium-header,
            .premium-footer {
                border-radius: 20px;
                padding: 25px;
            }
            .reels-container {
                gap: 12px;
                padding: 15px;
                margin-bottom: 25px;
            }
            .reel-cell {
                padding: 8px;
            }
            .btn {
                padding: 18px 35px;
                font-size: 1.1em;
            }
            .btn-spin {
                padding: 22px 45px;
                font-size: 1.4em;
            }
            .bet-display {
                padding: 14px 25px;
                font-size: 1.1em;
            }
        }

        /* ===================== MOBILE SPECIFIC ===================== */
        @media (max-width: 600px) {
            .container { padding: 4px; }
            .main-card { padding: 4px; border-radius: 12px; }
            .premium-header { padding: 6px; margin-bottom: 4px; }
            .slot-title { font-size: 18px; margin-bottom: 4px; }
            .mult-badge { padding: 6px 10px; font-size: 0.7em; }
            .reels-container { gap: 4px; padding: 4px; margin-bottom: 4px; }
            .premium-footer { padding: 6px; }
            .button-row { gap: 4px; }
            .button-left { gap: 4px; }
            .button-right { gap: 4px; }
            .btn { padding: 10px 12px; font-size: 0.8em; }
            .btn-spin { font-size: 1em; padding: 12px 16px; }
            .bet-label { font-size: 0.7em; }
            .bet-display { padding: 6px 12px; font-size: 0.8em; }
            .bet-options { bottom: 40px; min-width: 70px; }
            .bet-option { padding: 6px 12px; font-size: 0.8em; }
            .message { font-size: 0.85em; min-height: 25px; }
            .free-spins-msg { font-size: 0.8em; }
        }

        @media (max-width: 400px) {
            .btn { padding: 8px 10px; font-size: 0.75em; }
            .btn-spin { font-size: 0.9em; padding: 10px 14px; }
            .slot-title { font-size: 16px; }
            .mult-badge { padding: 4px 8px; font-size: 0.65em; }
            .bet-display { padding: 5px 10px; font-size: 0.75em; }
        }
    </style>
</head>
<body>
    <!-- ===================== LOADING OVERLAY ===================== -->
    <div id="loadingOverlay">
        <div class="loader"></div>
        <p>Loading game…</p>
    </div>

    <!-- ===================== START SCREEN ===================== -->
    <div id="startScreen" style="display:none;">
        <h1>🐾 ANIMAL SLOTS</h1>
        <p>Welcome! Press the button to start playing.</p>
        <button id="startBtn">START GAME</button>
    </div>

    <!-- Background music (now uses gameplay.wav) -->
    <audio id="bgMusic" loop></audio>

    <!-- ===================== HEADER ===================== -->
    <header class="nf-header" style="display:none;">
        <div class="header-left">
            <button class="header-icon-btn" id="menuBtn">
                <span class="material-icons">menu</span>
            </button>
            <div class="dropdown-menu" id="dropdownMenu">
                <a href="earn.html" class="dropdown-item">Earn Coins</a>
                <a href="withdraw.html" class="dropdown-item">Withdraw</a>
                <a href="#" class="dropdown-item" id="logoutItem">Logout</a>
            </div>
        </div>
        <div class="header-balance">
            <img src="/coin.png" alt="Coin">
            <span id="balanceValue">0</span>
        </div>
    </header>

    <!-- ===================== MAIN GAME ===================== -->
    <div class="container" id="gameContainer" style="display:none;">
        <div class="main-card">
            <!-- Premium header: title + multipliers -->
            <div class="premium-header">
                <div class="slot-title">🐾 ANIMAL SLOTS</div>
                <div class="multiplier-row">
                    <span class="mult-badge" data-mult="0">0x</span>
                    <span class="mult-badge" data-mult="1">1x</span>
                    <span class="mult-badge" data-mult="2">2x</span>
                    <span class="mult-badge" data-mult="3">3x</span>
                    <span class="mult-badge" data-mult="4">4x</span>
                    <span class="mult-badge" data-mult="6">6x</span>
                    <span class="mult-badge" data-mult="10">10x</span>
                </div>
            </div>

            <!-- Reels premium container -->
            <div class="reels-container" id="reelsContainer"></div>

            <!-- Premium footer: buttons + bet -->
            <div class="premium-footer">
                <div class="button-row">
                    <div class="button-left">
                        <button class="btn btn-auto" id="autoSpinBtn">AUTO</button>
                        <button class="btn btn-stop" id="stopBtn" disabled>STOP</button>
                    </div>
                    <div class="button-center">
                        <button class="btn btn-spin" id="spinBtn">SPIN</button>
                    </div>
                    <div class="button-right">
                        <label class="bet-label">Bet:</label>
                        <div class="custom-bet-dropdown">
                            <button type="button" class="bet-display" id="betDisplayBtn">
                                <span id="betDisplayValue">1</span>
                                <span class="material-icons">arrow_drop_down</span>
                            </button>
                            <div class="bet-options" id="betOptions">
                                <div class="bet-option" data-value="1">1</div>
                                <div class="bet-option" data-value="2">2</div>
                                <div class="bet-option" data-value="5">5</div>
                                <div class="bet-option" data-value="10">10</div>
                                <div class="bet-option" data-value="20">20</div>
                                <div class="bet-option" data-value="30">30</div>
                                <div class="bet-option" data-value="50">50</div>
                                <div class="bet-option" data-value="100">100</div>
                                <div class="bet-option" data-value="200">200</div>
                                <div class="bet-option" data-value="500">500</div>
                                <div class="bet-option" data-value="1000">1000</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="message" id="message"></div>
                <div class="free-spins-msg" id="freeSpinsMsg"></div>
            </div>
        </div>
    </div>

    <div id="confetti-container"></div>

    <script>
        // ===================== FIREBASE (dynamic import with error handling) =====================
        (async () => {
            const loadingOverlay = document.getElementById('loadingOverlay');
            try {
                const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js");
                const { getAuth, onAuthStateChanged, signOut } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js");
                const { getFirestore, doc, getDoc, setDoc, onSnapshot, updateDoc } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js");

                const firebaseConfig = {
                    apiKey: "AIzaSyAzjmVZUTLMeX1R-W2V86RBKrKP6bgl6iU",
                    authDomain: "yourtv-c12eb.firebaseapp.com",
                    projectId: "yourtv-c12eb",
                    storageBucket: "yourtv-c1eb.firebasestorage.app",
                    messagingSenderId: "28690991912",
                    appId: "1:28690991912:web:3cbc631ba0201b7caede1d",
                    measurementId: "G-CC7DLZS0NB"
                };

                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);

                let currentUser = null;
                let unsubscribeCoins = null;

                // DOM elements
                const startScreen = document.getElementById('startScreen');
                const startBtn = document.getElementById('startBtn');
                const header = document.querySelector('.nf-header');
                const gameContainer = document.getElementById('gameContainer');
                const balanceValueSpan = document.getElementById('balanceValue');
                const logoutItem = document.getElementById('logoutItem');

                // Wait for auth state
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        currentUser = user;
                        loadingOverlay.style.display = 'none';
                        startScreen.style.display = 'flex';
                        startBtn.addEventListener('click', () => {
                            startScreen.style.display = 'none';
                            header.style.display = 'flex';
                            gameContainer.style.display = 'flex';
                            initGame();
                        }, { once: true });
                    } else {
                        window.location.href = 'login.html';
                    }
                });

                async function initGame() {
                    await syncServerBalanceFromFirestore();
                    listenToCoins();
                    createReels();
                    updateMultiplierBadges(0);
                    updateButtons();
                    startBackgroundMusic();
                }

                async function syncServerBalanceFromFirestore() {
                    if (!currentUser) return;
                    const userRef = doc(db, "users", currentUser.uid);
                    const userSnap = await getDoc(userRef);
                    if (userSnap.exists()) {
                        const firebaseCoins = userSnap.data().coins || 0;
                        await fetch('/api/sync-balance', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ balance: firebaseCoins })
                        });
                        setBalance(firebaseCoins);
                    } else {
                        await setDoc(userRef, { coins: 0 });
                        await fetch('/api/sync-balance', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ balance: 0 })
                        });
                        setBalance(0);
                    }
                }

                function listenToCoins() {
                    if (!currentUser) return;
                    if (unsubscribeCoins) unsubscribeCoins();
                    const userRef = doc(db, "users", currentUser.uid);
                    unsubscribeCoins = onSnapshot(userRef, (docSnap) => {
                        if (docSnap.exists()) {
                            const coins = docSnap.data().coins || 0;
                            setBalance(coins);
                        }
                    });
                }

                function setBalance(value) {
                    const parsed = Number(value);
                    if (!Number.isFinite(parsed)) return;
                    currentBalance = Math.max(0, parsed);
                    balanceValueSpan.textContent = String(currentBalance);
                }

                function getBalanceFromData(data) {
                    if (!data || typeof data !== 'object') return undefined;
                    if (data.newBalance !== undefined && data.newBalance !== null) return data.newBalance;
                    if (data.balance !== undefined && data.balance !== null) return data.balance;
                    return undefined;
                }

                // ===================== GAME CONSTANTS =====================
                const VISIBLE_ROWS = 5;
                const REEL_COUNT = 5;
                const STRIP_LENGTH = 60;
                const STRIP_OFFSET = 10;

                const SYMBOLS = [
                    { id: 'scatter', image: '/images/scatter.png', isScatter: true, isWild: false },
                    { id: 'wild',     image: '/images/wild.png',     isScatter: false, isWild: true },
                    { id: 'lion',     image: '/images/lion.png' },
                    { id: 'tiger',    image: '/images/tiger.png' },
                    { id: 'badger',   image: '/images/badger.png' },
                    { id: 'bear',     image: '/images/bear.png' },
                    { id: 'boar',     image: '/images/boar.png' },
                    { id: 'dragon',   image: '/images/dragon.png' },
                    { id: 'duck',     image: '/images/duck.png' },
                    { id: 'eagle',    image: '/images/eagle.png' },
                    { id: 'elephant', image: '/images/elephant.png' },
                    { id: 'frog',     image: '/images/frog.png' },
                    { id: 'goat',     image: '/images/goat.png' },
                    { id: 'gorilla',  image: '/images/gorilla.png' },
                    { id: 'hawk',     image: '/images/hawk.png' },

                    { id: 'pig',      image: '/images/pig.png' },
                    { id: 'rabbit',   image: '/images/rabbit.png' },
                    { id: 'racoon',   image: '/images/racoon.png' },
                    { id: 'rhino',    image: '/images/rhino.png' },
                    { id: 'rooster',  image: '/images/rooster.png' },
                    { id: 'shark',    image: '/images/shark.png' },
                    { id: 'squirrel', image: '/images/squirrel.png' },
                    { id: 'wolf',     image: '/images/wolf.png' }
                ];

                const reelStrips = [];
                const reelColumns = [];
                let isSpinning = false;
                let autoSpinning = false;
                let autoSpinsRemaining = 0;
                let autoSpinTimer = null;
                let autoFreeSpinsActive = false;
                let autoFreeSpinTimer = null;
                let freeSpinSessionTotalWin = 0;
                let currentBalance = 0;
                let pendingBetDeduction = 0;
                let currentBetValue = 1;

                // ===================== AUDIO =====================
                const REEL_AUDIO = [
                    { roll: '/rolling-reels.wav', stop: null },
                    { roll: '/rolling-reels.wav', stop: null },
                    { roll: '/rolling-reels.wav', stop: null },
                    { roll: '/rolling-reels.wav', stop: null },
                    { roll: '/rolling-reels.wav', stop: null },
                ];

                let audioContext = null;
                let rollingAudios = [];
                let reelStoppedCount = 0;

                function initAudio() {
                    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioContext.state === 'suspended') audioContext.resume();
                }

                function playTone(freq, dur, type='sine', vol=0.3, when=0) {
                    initAudio();
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    gain.gain.value = vol;
                    gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + dur + when);
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.start(audioContext.currentTime + when);
                    osc.stop(audioContext.currentTime + dur + when);
                }

                function startRollingSound() {
                    initAudio();
                    reelStoppedCount = 0;
                    stopRollingSound();

                    REEL_AUDIO.forEach((cfg, index) => {
                        let audio = new Audio(cfg.roll || '/rolling-reels.wav');
                        audio.loop = true;
                        audio.volume = 0.3;   // unchanged
                        audio.play().catch(err => console.warn(`Reel ${index+1} rolling sound failed:`, err));
                        rollingAudios.push(audio);
                    });
                }

                function stopRollingSound() {
                    rollingAudios.forEach(audio => {
                        audio.pause();
                        audio.currentTime = 0;
                    });
                    rollingAudios = [];
                }

                function playReelStop(reelIndex) {
                    reelStoppedCount++;
                    // Unchanged clank volume
                    playTone(600 + (reelIndex + 1) * 80, 0.12, 'square', 0.5);
                    playTone(400, 0.1, 'square', 0.4, 0.03);
                }

                function playWinSound() {

                    audio.volume = 1.0;   // max
                    audio.play().catch(() => playTone(880, 0.15, 'sine', 0.8));
                }

                function playScatterWinSound() {
                    const audio = new Audio('/you-won-scatter.wav');
                    audio.volume = 1.0;
                    audio.play().catch(() => {
                        playTone(523, 0.1, 'triangle', 0.9);
                        setTimeout(() => playTone(659, 0.1, 'triangle', 0.9), 80);
                        setTimeout(() => playTone(784, 0.15, 'triangle', 0.9), 160);
                    });
                }

                function playFreeSpinsSound() {
                    const audio = new Audio('/free-spin.wav');
                    audio.volume = 1.0;
                    audio.play().catch(() => {
                        playTone(400, 0.1, 'triangle', 0.8);
                        setTimeout(() => playTone(500, 0.1, 'triangle', 0.8), 150);
                        setTimeout(() => playTone(600, 0.2, 'triangle', 0.8), 300);
                    });
                }

                function playTotalWinSound() {
                    const audio = new Audio('/total-win.wav');
                    audio.volume = 1.0;
                    audio.play().catch(() => {
                        [523, 659, 784, 1046].forEach((f,i)=>playTone(f,0.2,'sine',0.8,i*0.12));
                    });
                }

                function playDoubleSound() {
                    const audio = new Audio('/double.wav');
                    audio.volume = 1.0;
                    audio.play().catch(() => {
                        playTone(500, 0.08, 'square', 0.8);
                        setTimeout(() => playTone(700, 0.08, 'square', 0.8), 60);
                    });
                }

                function playCoinSound() {
                    const audio = new Audio('/coin.wav');
                    audio.volume = 1.0;
                    audio.play().catch(() => {
                        playTone(800, 0.08, 'square', 0.3);
                        setTimeout(() => playTone(1000, 0.08, 'square', 0.3), 100);
                        setTimeout(() => playTone(1200, 0.1, 'square', 0.25), 200);
                    });
                }

                function playMultiplierSound(mult) {
                    let file;
                    switch(mult) {
                        case 0: file = null; break;
                        case 1: file = '/1-time.wav'; break;
                        case 2: file = '/2-times.wav'; break;
                        case 3: file = '/3-times.wav'; break;
                        case 4: file = '/4-times.wav'; break;
                        case 6: file = '/6-times.wav'; break;
                        case 10: file = '/10-times.wav'; break;
                        default: return;
                    }
                    if (file) {
                        const audio = new Audio(file);
                        audio.volume = 1.0;
                        audio.play().catch(() => playTone(880, 0.1, 'sine', 0.7));
                    }
                }

                function playButtonClickSound() {
                    playTone(200, 0.08, 'square', 0.6);   // slightly louder
                    playTone(300, 0.08, 'square', 0.5, 0.04);
                }

                function startBackgroundMusic() {
                    const bgMusic = document.getElementById('bgMusic');
                    bgMusic.src = '/gameplay.wav';
                    bgMusic.volume = 0.4;
                    bgMusic.play().catch(err => console.warn('Background music failed:', err));
                }

                // ===================== ANIMATED TOTAL WIN COUNTER =====================
                function animateTotalWin(finalTotal) {
                    return new Promise((resolve) => {
                        const messageDiv = document.getElementById('message');
                        if (finalTotal <= 0) {
                            messageDiv.innerHTML = `<div style="font-weight:900; color:#f1c40f;">🎉 FREE SPINS TOTAL WIN: 0 🪙</div>`;
                            resolve();
                            return;
                        }

                        const counterAudio = new Audio('/counter.wav');
                        counterAudio.volume = 0.8;
                        counterAudio.loop = true;
                        counterAudio.play().catch(err => console.warn('Counter sound failed:', err));

                        const duration = 2000;
                        const startTime = performance.now();

                        messageDiv.innerHTML = `<div style="font-weight:900; color:#f1c40f;">🎉 FREE SPINS TOTAL WIN: <span id="freeSpinTotalCounter">0</span> 🪙</div>`;

                        function update(now) {
                            const elapsed = now - startTime;
                            const progress = Math.min(elapsed / duration, 1);
                            const currentValue = Math.floor(progress * finalTotal);

                            const el = document.getElementById('freeSpinTotalCounter');
                            if (el) el.textContent = currentValue;

                            if (progress < 1) {
                                requestAnimationFrame(update);
                            } else {
                                if (el) el.textContent = finalTotal;
                                counterAudio.pause();
                                counterAudio.currentTime = 0;
                                playTotalWinSound();
                                resolve();
                            }
                        }

                        requestAnimationFrame(update);
                    });
                }

                // ===================== REELS =====================
                function getCellHeight() { const cell = document.querySelector('.reel-cell'); return cell ? cell.offsetHeight : 110; }

                function createReels() {
                    const reelsContainer = document.getElementById('reelsContainer');
                    reelsContainer.innerHTML = '';
                    reelStrips.length = 0;
                    reelColumns.length = 0;
                    const containerWidth = reelsContainer.clientWidth - 20;
                    const availableWidth = Math.min(containerWidth, 900);
                    const gap = 10;
                    const totalGap = gap * (REEL_COUNT - 1);
                    const maxCellWidth = Math.floor((availableWidth - totalGap) / REEL_COUNT);
                    const maxCellHeight = window.innerWidth < 600 ? 80 : 110;
                    const cellSize = Math.min(maxCellWidth, maxCellHeight);
                    reelsContainer.style.height = (cellSize * VISIBLE_ROWS + 20) + 'px';
                    reelsContainer.style.overflowX = 'auto';

                    for (let col = 0; col < REEL_COUNT; col++) {
                        const column = document.createElement('div');
                        column.className = 'reel-column';
                        column.style.width = cellSize + 'px';
                        column.style.height = (cellSize * VISIBLE_ROWS) + 'px';
                        column.style.flex = `0 0 ${cellSize}px`;

                        const strip = document.createElement('div');
                        strip.className = 'reel-strip';
                        strip.style.transform = 'translateY(0px)';
                        column.appendChild(strip);
                        reelsContainer.appendChild(column);
                        reelColumns.push(column);
                        reelStrips.push(strip);

                        for (let i = 0; i < STRIP_LENGTH; i++) {
                            const symbol = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
                            const cell = createReelCell(symbol);
                            cell.style.height = cellSize + 'px';
                            cell.style.width = cellSize + 'px';
                            strip.appendChild(cell);
                        }
                    }
                }

                function createReelCell(symbol) {
                    const cell = document.createElement('div');
                    cell.className = 'reel-cell';
                    const img = document.createElement('img');
                    img.src = symbol.image;
                    img.alt = symbol.id;
                    img.loading = 'eager';
                    img.draggable = false;
                    img.onerror = function() { this.style.display='none'; this.parentNode.textContent='🐾'; };
                    cell.appendChild(img);
                    return cell;
                }

                function prepareStrip(strip, finalColSymbols) {
                    const cellHeight = getCellHeight();
                    const cells = strip.children;
                    for (let i = 0; i < VISIBLE_ROWS; i++) {
                        const cellIndex = STRIP_OFFSET + i;
                        if (cellIndex < cells.length) {
                            const symbol = finalColSymbols[i] || SYMBOLS[0];
                            const img = cells[cellIndex].querySelector('img');
                            if (img) {
                                img.src = symbol.image;
                                img.alt = symbol.id;
                            }
                        }
                    }
                    return -(STRIP_OFFSET * cellHeight);
                }

                function getCellElement(pos) {
                    const strip = reelStrips[pos.col];
                    if (!strip) return null;
                    const cellIndex = STRIP_OFFSET + pos.row;
                    return strip.children[cellIndex];
                }

                function highlightPositions(positions) {
                    positions.forEach(pos => {
                        const cell = getCellElement(pos);
                        if (cell) cell.classList.add('win');
                    });
                }

                function clearHighlights() {
                    document.querySelectorAll('.reel-cell.win').forEach(c => c.classList.remove('win'));
                }

                function updateMultiplierBadges(mult) {
                    document.querySelectorAll('.mult-badge').forEach(badge => {
                        const val = parseInt(badge.dataset.mult);
                        badge.classList.toggle('active', val === mult);
                    });
                    if (mult > 0) playMultiplierSound(mult);
                }

                function spawnCoins(count = 40) {
                    playCoinSound();
                    for (let i = 0; i < count; i++) {
                        const c = document.createElement('div');
                        c.className = 'coin';
                        c.style.left = Math.random() * 100 + '%';
                        c.style.top = '-30px';
                        const size = Math.random() * 10 + 20;
                        c.style.width = size + 'px';
                        c.style.height = size + 'px';
                        c.style.animationDuration = (Math.random() * 3 + 2) + 's';
                        c.style.animationDelay = Math.random() * 0.5 + 's';
                        c.style.opacity = 0.9;
                        document.getElementById('confetti-container').appendChild(c);
                        setTimeout(() => c.remove(), 5000);
                    }
                }

                // ===================== WIN PROCESSING =====================
                async function processWins(spinData, isFreeSpin) {
                    const messageDiv = document.getElementById('message');
                    const freeSpinsMsgDiv = document.getElementById('freeSpinsMsg');
                    try {
                        const wins = spinData.wins || [];

                        for (const win of wins) {
                            if (win.type === 'scatter') {
                                messageDiv.textContent = `Scatter ${win.count}x! +${win.winAmount} coins`;
                                playScatterWinSound();
                                await new Promise(r => setTimeout(r, 1200));
                                continue;
                            }

                            if (win.wildPositionsUsed && win.wildPositionsUsed.length > 0) {
                                for (const wildPos of win.wildPositionsUsed) {
                                    const cell = getCellElement(wildPos);
                                    if (!cell) continue;
                                    const img = cell.querySelector('img');
                                    if (!img) continue;
                                    playDoubleSound();
                                    img.style.transition = 'transform 0.5s';
                                    img.style.transform = 'rotateY(90deg)';
                                    await new Promise(r => setTimeout(r, 250));
                                    img.src = win.symbol.image;
                                    img.style.transform = 'rotateY(0deg)';
                                    await new Promise(r => setTimeout(r, 250));
                                }
                            }

                            highlightPositions(win.positions || []);
                            playWinSound();
                            messageDiv.textContent = `${win.symbol.id.toUpperCase()} x${win.count} = ${win.winAmount} coins`;
                            await new Promise(r => setTimeout(r, 800));
                            clearHighlights();
                            await new Promise(r => setTimeout(r, 300));
                        }

                        let totalWin = Number(spinData.totalWin ?? 0);
                        if (!Number.isFinite(totalWin) || totalWin <= 0) {
                            totalWin = wins.reduce((sum, w) => sum + (Number(w.winAmount) || 0), 0);
                        }

                        if (totalWin > 0) {
                            spawnCoins(50);
                            playTotalWinSound();

                            if (isFreeSpin) {
                                freeSpinSessionTotalWin += totalWin;
                                messageDiv.innerHTML = `
                                    <div style="font-weight:900; color:#f1c40f;">
                                        Free spin win: ${totalWin} 🪙<br>
                                        <span style="font-size:0.9em;">Total free spins win: ${freeSpinSessionTotalWin} 🪙</span>
                                    </div>`;
                            } else {
                                messageDiv.innerHTML = `
                                    <div style="font-weight:900; color:#f1c40f;">
                                        🎉 TOTAL PRIZE WON: ${totalWin} 🪙
                                    </div>`;
                            }
                        } else {
                            messageDiv.textContent = 'No win. Try again!';
                        }

                        // Update Firestore with new balance from server
                        const newBalance = getBalanceFromData(spinData);
                        if (newBalance !== undefined && currentUser) {
                            await updateDoc(doc(db, "users", currentUser.uid), { coins: newBalance });
                            setBalance(newBalance);
                        }

                        if (spinData.totalFreeSpinWin !== undefined) {
                            const totalFreeSpinWin = Number(spinData.totalFreeSpinWin);
                            await animateTotalWin(totalFreeSpinWin);
                        }

                        if (spinData && spinData.freeSpinsAwarded > 0) {
                            freeSpinsMsgDiv.textContent = `🎁 +${spinData.freeSpinsAwarded} Free Spins!`;
                            playFreeSpinsSound();
                        } else if (spinData && spinData.freeSpinsRemaining > 0) {
                            freeSpinsMsgDiv.textContent = `🎁 Free spins remaining: ${spinData.freeSpinsRemaining}`;
                        } else {
                            if (isFreeSpin) {
                                freeSpinsMsgDiv.textContent = '';
                            }
                        }

                        if (spinData && spinData.currentMultiplier !== undefined) {
                            updateMultiplierBadges(spinData.currentMultiplier);
                        }
                    } catch (err) {
                        console.error('processWins error:', err);
                        messageDiv.textContent = 'Error processing wins';
                    }
                }

                // ===================== BUTTON STATE =====================
                function updateButtons() {
                    const spinBtn = document.getElementById('spinBtn');
                    const autoSpinBtn = document.getElementById('autoSpinBtn');
                    const stopBtn = document.getElementById('stopBtn');
                    const anyAutoActive = autoSpinning || autoFreeSpinsActive;
                    spinBtn.disabled = isSpinning || anyAutoActive;
                    autoSpinBtn.disabled = isSpinning || anyAutoActive;
                    stopBtn.disabled = !anyAutoActive;
                }

                // ===================== SPIN =====================
                async function spin(isFreeSpin = false, callback = null) {
                    if (isSpinning) return;
                    isSpinning = true;
                    updateButtons();
                    document.getElementById('message').textContent = '';
                    if (!isFreeSpin) document.getElementById('freeSpinsMsg').textContent = '';
                    clearHighlights();

                    const bet = currentBetValue || 1;

                    if (!isFreeSpin) {
                        if (bet > currentBalance) {
                            document.getElementById('message').textContent = 'Not enough coins for this bet.';
                            isSpinning = false;
                            updateButtons();
                            return;
                        }
                        pendingBetDeduction = bet;
                        setBalance(currentBalance - bet);
                    }

                    startRollingSound();
                    const requestBody = isFreeSpin ? { isFreeSpin: true } : { bet };

                    const MIN_SPIN_DURATION = 2000;
                    const STOP_START_DELAY = 300;

                    const spinStates = reelStrips.map((_, col) => ({
                        currentY: 0,
                        spinning: true,
                        stopping: false,
                        stopStartTime: 0,
                        startY: 0,
                        targetY: 0,
                        stopDuration: 400,
                        stopDelay: col * STOP_START_DELAY,
                    }));

                    const spinStartTime = performance.now();

                    let responseReady = false;
                    let finalTranslateYs = new Array(REEL_COUNT).fill(0);
                    let grid = null;
                    let spinData = null;
                    let forceStop = false;

                    let lastTime = performance.now();
                    function animateReels(now) {
                        const deltaTime = Math.min(now - lastTime, 100);
                        lastTime = now;

                        let anyActive = false;

                        reelStrips.forEach((strip, col) => {
                            const state = spinStates[col];
                            if (!state.spinning && !state.stopping) return;

                            anyActive = true;

                            if (forceStop) {
                                state.spinning = false;
                                state.stopping = false;
                                strip.style.transition = 'none';
                                strip.style.transform = `translate3d(0, 0, 0)`;
                                return;
                            }

                            if (state.spinning) {
                                state.currentY -= (1200 * deltaTime) / 1000;
                                const maxY = -(STRIP_LENGTH - VISIBLE_ROWS) * getCellHeight();
                                if (state.currentY < maxY) state.currentY = 0;
                                strip.style.transition = 'none';
                                strip.style.transform = `translate3d(0, ${state.currentY}px, 0)`;
                            }

                            if (responseReady && !state.stopping &&
                                (now - spinStartTime) >= MIN_SPIN_DURATION + state.stopDelay) {
                                state.stopping = true;
                                state.stopStartTime = performance.now();
                                state.startY = state.currentY;
                                state.targetY = finalTranslateYs[col];
                                playReelStop(col);
                            }

                            if (state.stopping) {
                                const elapsed = now - state.stopStartTime;
                                const progress = Math.min(elapsed / state.stopDuration, 1);
                                const eased = 1 - Math.pow(1 - progress, 3);
                                const y = state.startY + (state.targetY - state.startY) * eased;
                                strip.style.transition = 'none';
                                strip.style.transform = `translate3d(0, ${y}px, 0)`;

                                if (progress >= 1) {
                                    state.stopping = false;
                                    state.spinning = false;
                                    reelColumns[col].classList.add('stopping');
                                    setTimeout(() => reelColumns[col].classList.remove('stopping'), 150);
                                }
                            }
                        });

                        if (anyActive) {
                            requestAnimationFrame(animateReels);
                        } else {
                            stopRollingSound();
                            setTimeout(() => {
                                if (spinData) {
                                    processWins(spinData, isFreeSpin).then(() => {
                                        isSpinning = false;
                                        updateButtons();
                                        if (!isFreeSpin && spinData.freeSpinsAwarded > 0) {
                                            startAutoFreeSpins();
                                        }
                                        if (callback) callback(spinData);
                                    });
                                } else {
                                    isSpinning = false;
                                    updateButtons();
                                    if (callback) callback(spinData);
                                }
                            }, 200);
                        }
                    }

                    requestAnimationFrame(animateReels);

                    try {
                        const res = await fetch('/api/spin', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(requestBody)
                        });
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.error || 'Spin failed');
                        spinData = data;
                        grid = data.grid;

                        for (let col = 0; col < REEL_COUNT; col++) {
                            const colSymbols = grid[col].map(sym => SYMBOLS.find(s => s.id === sym.id) || SYMBOLS[0]);
                            finalTranslateYs[col] = prepareStrip(reelStrips[col], colSymbols);
                        }
                        responseReady = true;
                    } catch (err) {
                        console.error(err);
                        forceStop = true;
                        if (!isFreeSpin && pendingBetDeduction > 0) {
                            setBalance(currentBalance + pendingBetDeduction);
                            pendingBetDeduction = 0;
                        }
                        stopRollingSound();
                        document.getElementById('message').textContent = 'Error: ' + err.message;
                        isSpinning = false;
                        updateButtons();
                        if (callback) callback(spinData);
                    }
                }

                // ===================== AUTO SPIN =====================
                function startAutoSpin() {
                    if (autoSpinning || isSpinning || autoFreeSpinsActive) return;
                    autoSpinning = true;
                    autoSpinsRemaining = 10;
                    updateButtons();
                    autoSpinLoop();
                }
                function autoSpinLoop() {
                    if (!autoSpinning) return;
                    if (autoSpinsRemaining <= 0) {
                        autoSpinning = false;
                        updateButtons();
                        document.getElementById('message').textContent = 'Auto spin completed.';
                        return;
                    }
                    autoSpinsRemaining--;
                    spin(false, () => { autoSpinTimer = setTimeout(autoSpinLoop, 2000); });
                }

                // ===================== AUTO FREE SPINS =====================
                function startAutoFreeSpins() {
                    if (autoFreeSpinsActive || isSpinning) return;
                    if (autoSpinning) {
                        autoSpinning = false;
                        clearTimeout(autoSpinTimer);
                    }
                    autoFreeSpinsActive = true;
                    freeSpinSessionTotalWin = 0;
                    updateButtons();
                    document.getElementById('message').textContent = '🎰 Starting Free Spins!';
                    autoFreeSpinLoop();
                }
                function autoFreeSpinLoop() {
                    if (!autoFreeSpinsActive) return;
                    spin(true, (spinData) => {
                        if (!autoFreeSpinsActive) return;
                        if (spinData && spinData.freeSpinsRemaining > 0) {
                            autoFreeSpinTimer = setTimeout(autoFreeSpinLoop, 2000);
                        } else {
                            autoFreeSpinsActive = false;
                            updateButtons();
                            document.getElementById('message').innerHTML = `Free spins completed!<br>Total won: ${freeSpinSessionTotalWin} 🪙`;
                            document.getElementById('freeSpinsMsg').textContent = '';
                        }
                    });
                }
                function stopAllAuto() {
                    if (autoFreeSpinsActive) {
                        autoFreeSpinsActive = false;
                        clearTimeout(autoFreeSpinTimer);
                        updateButtons();
                        document.getElementById('message').innerHTML = `Free spins stopped.<br>Total won: ${freeSpinSessionTotalWin} 🪙`;
                        document.getElementById('freeSpinsMsg').textContent = '';
                    } else if (autoSpinning) {
                        autoSpinning = false;
                        clearTimeout(autoSpinTimer);
                        updateButtons();
                        document.getElementById('message').textContent = 'Auto spin stopped.';
                    }
                }

                // ===================== LOGOUT =====================
                document.getElementById('logoutItem').addEventListener('click', async (e) => {
                    e.preventDefault();
                    if (unsubscribeCoins) unsubscribeCoins();
                    await signOut(auth);
                    window.location.href = 'login.html';
                });

                // ===================== EVENT LISTENERS =====================
                document.getElementById('spinBtn').addEventListener('click', () => spin(false));
                document.getElementById('autoSpinBtn').addEventListener('click', startAutoSpin);
                document.getElementById('stopBtn').addEventListener('click', stopAllAuto);
                document.getElementById('menuBtn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    const dropdownMenu = document.getElementById('dropdownMenu');
                    dropdownMenu.style.display = dropdownMenu.style.display === 'block' ? 'none' : 'block';
                });
                document.addEventListener('click', () => {
                    document.getElementById('dropdownMenu').style.display = 'none';
                });
                document.getElementById('betDisplayBtn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    const betOptions = document.getElementById('betOptions');
                    betOptions.style.display = betOptions.style.display === 'block' ? 'none' : 'block';
                });
                document.querySelectorAll('.bet-option').forEach(option => {
                    option.addEventListener('click', () => {
                        currentBetValue = parseInt(option.dataset.value);
                        document.getElementById('betDisplayValue').textContent = currentBetValue;
                        document.querySelectorAll('.bet-option').forEach(o => o.classList.remove('selected'));
                        option.classList.add('selected');
                        document.getElementById('betOptions').style.display = 'none';
                    });
                });
                window.addEventListener('resize', () => { if (!isSpinning) createReels(); });
                document.addEventListener('click', (e) => {
                    if (e.target.closest('button, .btn, .header-icon-btn, #startBtn')) {
                        playButtonClickSound();
                    }
                });

            } catch (err) {
                console.error('Failed to load Firebase:', err);
                loadingOverlay.innerHTML = '<p style="color:red;">Error loading game. Please refresh.</p>';
            }
        })();
    </script>
</body>
</html>
