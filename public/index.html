<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scatter Slot – Full Stack</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: radial-gradient(circle at center, #2c3e50, #1a252f);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .game-container {
            background: #1e272e;
            padding: 20px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            text-align: center;
            color: #fff;
            max-width: 750px;
            width: 100%;
            border: 3px solid #f1c40f;
            position: relative;
            transition: box-shadow 0.3s, border-color 0.3s;
        }
        /* Win animation for game container */
        .game-container.win-animation {
            animation: containerWin 0.6s ease-in-out 3;
        }
        @keyframes containerWin {
            0% { box-shadow: 0 15px 35px rgba(0,0,0,0.8); border-color: #f1c40f; }
            50% { box-shadow: 0 0 30px #f1c40f; border-color: #fff; }
            100% { box-shadow: 0 15px 35px rgba(0,0,0,0.8); border-color: #f1c40f; }
        }
        h1 {
            margin-top: 0;
            font-size: 2.2em;
            letter-spacing: 2px;
            color: #f1c40f;
            text-shadow: 2px 2px 0 #e67e22;
            margin-bottom: 10px;
        }
        .balance {
            font-size: 1.4em;
            margin: 5px 0;
        }
        .bet-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }
        .bet-control label { font-size: 1.2em; }
        .bet-control input {
            width: 80px;
            padding: 10px;
            font-size: 1.2em;
            border: none;
            border-radius: 5px;
            text-align: center;
            background: #fff;
            color: #333;
            font-weight: bold;
        }
        .reels-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
            background: #0f151a;
            padding: 15px;
            border-radius: 15px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            position: relative;
        }
        .reel-column {
            width: 120px;
            height: 360px;
            overflow: hidden;
            position: relative;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 0 8px rgba(255,255,255,0.2);
        }
        .reel-strip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            /* transition set dynamically by JS */
        }
        .reel-cell {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #ddd;
            background: #fff;
            user-select: none;
        }
        .reel-cell .material-icons {
            font-size: 70px;
            color: inherit;
        }
        .reel-cell.win {
            background: #f9e79f;
            animation: glow 0.6s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { box-shadow: 0 0 8px #f1c40f; }
            to { box-shadow: 0 0 25px #f39c12; }
        }
        /* Reel bounce on stop */
        .reel-column.bounce {
            animation: bounce 0.3s ease-in-out;
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
            60% { transform: translateY(4px); }
            100% { transform: translateY(0); }
        }
        .spin-btn {
            background: #e67e22;
            border: none;
            padding: 15px 40px;
            font-size: 1.6em;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            color: #fff;
            text-shadow: 2px 2px 0 #b85e00;
            letter-spacing: 2px;
        }
        .spin-btn:hover { background: #f39c12; }
        .spin-btn:active { transform: scale(0.95); }
        .spin-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            text-shadow: none;
        }
        .message {
            min-height: 50px;
            font-size: 1.5em;
            margin: 15px 0;
            font-weight: bold;
            color: #fff;
        }
        .free-spins-msg {
            color: #2ecc71;
            font-size: 1.2em;
            min-height: 30px;
        }
        .scatter-info {
            font-size: 0.95em;
            color: #bbb;
            margin: 10px 0;
        }
        /* Balance flash */
        .balance.flash {
            animation: flash 0.5s ease;
        }
        @keyframes flash {
            0% { color: #fff; }
            50% { color: #f1c40f; }
            100% { color: #fff; }
        }
        /* Confetti container */
        #confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #f1c40f;
            animation: confetti-fall linear forwards;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(-100%) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
        /* Music toggle button */
        .music-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #333;
            border: none;
            color: #fff;
            font-size: 1.2em;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 50%;
            opacity: 0.7;
            transition: opacity 0.2s, background 0.2s;
        }
        .music-btn:hover {
            opacity: 1;
            background: #555;
        }
        /* WIN overlay banner */
        .win-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(0,0,0,0.8);
            color: #f1c40f;
            padding: 20px 40px;
            border-radius: 20px;
            font-size: 3em;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
            animation: popIn 0.5s forwards;
        }
        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            70% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="game-container" id="gameContainer">
        <button class="music-btn" id="musicBtn" title="Toggle music">🔊</button>
        <h1>🎰 SCATTER SLOTS</h1>
        <div class="balance" id="balance">💰 Balance: $<span id="balanceValue">0</span></div>
        <div class="bet-control">
            <label for="bet">Bet: $</label>
            <input type="number" id="bet" value="1" min="1" max="100">
        </div>
        <div class="reels-container" id="reelsContainer"></div>
        <button class="spin-btn" id="spinBtn">SPIN</button>
        <div class="message" id="message"></div>
        <div class="free-spins-msg" id="freeSpinsMsg"></div>
        <div class="scatter-info">⭐ = Scatter | 3⭐ = 5x + 5 spins | 4⭐ = 10x + 10 spins | 5⭐ = 50x + 20 spins | 6⭐ = 100x + 30 spins | 7⭐ = 200x + 50 spins</div>
        <!-- Win overlay element -->
        <div class="win-overlay" id="winOverlay"></div>
    </div>
    <div id="confetti-container"></div>

    <script>
        // ===================== CONFIGURATION =====================
        const SYMBOLS = [
            { icon: 'star',      color: '#f1c40f' },
            { icon: 'filter_7',  color: '#e74c3c' },
            { icon: 'diamond',   color: '#3498db' },
            { icon: 'favorite',  color: '#e74c3c' },
            { icon: 'flash_on',  color: '#f39c12' },
            { icon: 'ac_unit',   color: '#1abc9c' },
            { icon: 'whatshot',  color: '#e67e22' },
            { icon: 'bug_report',color: '#27ae60' },
            { icon: 'pets',      color: '#9b59b6' },
            { icon: 'local_florist', color: '#2ecc71' },
            { icon: 'wb_sunny',  color: '#f1c40f' },
            { icon: 'music_note',color: '#e91e63' }
        ];
        const SCATTER_ICON = 'star';
        const CELL_HEIGHT = 120;
        const VISIBLE_ROWS = 3;
        const REEL_COUNT = 5;
        const STRIP_LENGTH = 60;

        // DOM elements
        const gameContainer = document.getElementById('gameContainer');
        const balanceSpan = document.getElementById('balance');
        const balanceValueSpan = document.getElementById('balanceValue');
        const betInput = document.getElementById('bet');
        const spinBtn = document.getElementById('spinBtn');
        const messageDiv = document.getElementById('message');
        const freeSpinsMsgDiv = document.getElementById('freeSpinsMsg');
        const reelsContainer = document.getElementById('reelsContainer');
        const confettiContainer = document.getElementById('confetti-container');
        const musicBtn = document.getElementById('musicBtn');
        const winOverlay = document.getElementById('winOverlay');

        const reelStrips = [];
        const reelColumns = [];

        // ===================== AUDIO SYSTEM =====================
        let audioContext = null;
        let musicGainNode = null;
        let musicPlaying = false;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                musicGainNode = audioContext.createGain();
                musicGainNode.gain.value = 0.15;
                musicGainNode.connect(audioContext.destination);
            }
        }

        function playTone(frequency, duration, type = 'sine', volume = 0.3, when = 0) {
            initAudio();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.type = type;
            oscillator.frequency.value = frequency;
            gainNode.gain.value = volume;
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration + when);
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.start(audioContext.currentTime + when);
            oscillator.stop(audioContext.currentTime + duration + when);
        }

        function playSpinSound() {
            playTone(200, 0.2, 'sawtooth', 0.2);
            playTone(150, 0.3, 'sawtooth', 0.2);
        }

        function playReelStop() {
            playTone(800, 0.05, 'square', 0.2);
        }

        // Enhanced win sound: a quick ascending arpeggio
        function playWinSound() {
            const notes = [523, 659, 784, 1046];
            notes.forEach((freq, i) => {
                playTone(freq, 0.15, 'sine', 0.3, i * 0.1);
            });
        }

        function playFreeSpinsSound() {
            playTone(400, 0.1, 'triangle', 0.3);
            setTimeout(() => playTone(500, 0.1, 'triangle', 0.3), 150);
            setTimeout(() => playTone(600, 0.2, 'triangle', 0.3), 300);
        }

        // ----- Background Music Loop -----
        function startMusic() {
            initAudio();
            if (musicPlaying) return;
            musicPlaying = true;
            const notes = [261.63, 329.63, 392.00, 523.25];
            let noteIndex = 0;
            function scheduleNextNote() {
                if (!musicPlaying) return;
                const now = audioContext.currentTime;
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = 'triangle';
                osc.frequency.value = notes[noteIndex % notes.length];
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                osc.connect(gain);
                gain.connect(musicGainNode);
                osc.start(now);
                osc.stop(now + 0.8);
                noteIndex++;
                setTimeout(scheduleNextNote, 400);
            }
            scheduleNextNote();
        }

        function stopMusic() {
            musicPlaying = false;
        }

        musicBtn.addEventListener('click', () => {
            initAudio();
            if (musicPlaying) {
                stopMusic();
                musicBtn.textContent = '🔇';
            } else {
                startMusic();
                musicBtn.textContent = '🔊';
            }
        });

        // ===================== INITIALIZE REELS =====================
        function createReels() {
            for (let col = 0; col < REEL_COUNT; col++) {
                const column = document.createElement('div');
                column.className = 'reel-column';
                const strip = document.createElement('div');
                strip.className = 'reel-strip';
                column.appendChild(strip);
                reelsContainer.appendChild(column);
                reelColumns.push(column);
                reelStrips.push(strip);
                for (let i = 0; i < STRIP_LENGTH; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'reel-cell';
                    const sym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
                    const iconSpan = document.createElement('span');
                    iconSpan.className = 'material-icons';
                    iconSpan.textContent = sym.icon;
                    iconSpan.style.color = sym.color;
                    cell.appendChild(iconSpan);
                    strip.appendChild(cell);
                }
            }
        }

        // ===================== STATE MANAGEMENT =====================
        async function fetchState() {
            try {
                const res = await fetch('/api/state');
                const data = await res.json();
                balanceValueSpan.textContent = data.balance;
                betInput.max = data.balance;
                updateFreeSpinsMsg(data.freeSpins);
            } catch (err) {
                console.error('Failed to fetch state', err);
            }
        }

        function updateFreeSpinsMsg(count) {
            freeSpinsMsgDiv.textContent = count > 0 ? `🎁 Free spins remaining: ${count}` : "";
        }

        // ===================== REEL PREPARATION =====================
        function prepareStrip(strip, finalColumnSymbols) {
            strip.innerHTML = '';
            const minIndex = 2;
            const maxIndex = STRIP_LENGTH - VISIBLE_ROWS - 2;
            const idx = Math.floor(Math.random() * (maxIndex - minIndex + 1)) + minIndex;
            for (let i = 0; i < STRIP_LENGTH; i++) {
                const cell = document.createElement('div');
                cell.className = 'reel-cell';
                let sym;
                if (i >= idx - 1 && i <= idx + 1) {
                    sym = finalColumnSymbols[i - (idx - 1)];
                } else {
                    sym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
                }
                const iconSpan = document.createElement('span');
                iconSpan.className = 'material-icons';
                iconSpan.textContent = sym.icon;
                iconSpan.style.color = sym.color;
                cell.appendChild(iconSpan);
                strip.appendChild(cell);
            }
            return -(idx - 1) * CELL_HEIGHT;
        }

        // ===================== HIGHLIGHT SCATTERS =====================
        function highlightScatters(grid, finalTranslateYs) {
            for (let col = 0; col < REEL_COUNT; col++) {
                const strip = reelStrips[col];
                const cells = strip.children;
                const middleIndex = Math.round(-finalTranslateYs[col] / CELL_HEIGHT) + 1;
                for (let row = 0; row < VISIBLE_ROWS; row++) {
                    const cellIndex = middleIndex + row - 1;
                    if (grid[col][row].icon === SCATTER_ICON && cells[cellIndex]) {
                        cells[cellIndex].classList.add('win');
                        setTimeout(() => cells[cellIndex].classList.remove('win'), 1000);
                    }
                }
            }
        }

        // ===================== CONFETTI =====================
        function spawnConfetti(count = 50) {
            for (let i = 0; i < count; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.background = `hsl(${Math.random() * 360}, 80%, 60%)`;
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                confettiContainer.appendChild(confetti);
                setTimeout(() => confetti.remove(), 3000);
            }
        }

        // ===================== WIN OVERLAY =====================
        function showWinOverlay(amount) {
            winOverlay.textContent = `WIN $${amount}!`;
            winOverlay.style.animation = 'none';
            void winOverlay.offsetHeight; // reflow
            winOverlay.style.animation = 'popIn 0.5s forwards';
            setTimeout(() => {
                winOverlay.style.animation = '';
                winOverlay.textContent = '';
            }, 2000);
        }

        // ===================== SPIN LOGIC =====================
        async function spin(isFreeSpin = false) {
            spinBtn.disabled = true;
            messageDiv.textContent = "";
            playSpinSound();

            const bet = parseInt(betInput.value);
            const requestBody = isFreeSpin ? { isFreeSpin: true } : { bet };

            try {
                const res = await fetch('/api/spin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                const data = await res.json();
                if (!res.ok) {
                    messageDiv.textContent = data.error || 'Error';
                    spinBtn.disabled = false;
                    return;
                }

                // Update balance display with flash
                balanceValueSpan.textContent = data.newBalance;
                betInput.max = data.newBalance;
                balanceSpan.classList.add('flash');
                setTimeout(() => balanceSpan.classList.remove('flash'), 500);
                updateFreeSpinsMsg(data.freeSpinsRemaining);

                // Prepare reels
                const finalGrid = data.grid;
                const finalTranslateYs = [];
                for (let col = 0; col < REEL_COUNT; col++) {
                    const translateY = prepareStrip(reelStrips[col], finalGrid[col]);
                    finalTranslateYs.push(translateY);
                }

                // ----- REALISTIC ANIMATION WITH OVERSHOOT -----
                reelStrips.forEach((strip, col) => {
                    strip.style.transition = 'none';
                    strip.style.transform = `translateY(-${STRIP_LENGTH * CELL_HEIGHT}px)`;
                    void strip.offsetHeight;
                });

                const overshoot = 10;
                reelStrips.forEach((strip, col) => {
                    const delay = col * 0.15;
                    const duration = 1.2;
                    const settleDuration = 0.2;
                    const finalY = finalTranslateYs[col];
                    const overshootY = finalY + overshoot;
                    strip.style.transition = `transform ${duration}s cubic-bezier(0.25, 0.1, 0.15, 1) ${delay}s`;
                    strip.style.transform = `translateY(${overshootY}px)`;
                    const settleStart = (duration + delay) * 1000;
                    setTimeout(() => {
                        strip.style.transition = `transform ${settleDuration}s cubic-bezier(0.25, 0.1, 0.25, 1)`;
                        strip.style.transform = `translateY(${finalY}px)`;
                    }, settleStart);
                });

                for (let col = 0; col < REEL_COUNT; col++) {
                    const stopDelay = (1.2 + col * 0.15) * 1000;
                    setTimeout(() => {
                        playReelStop();
                        reelColumns[col].classList.add('bounce');
                        setTimeout(() => reelColumns[col].classList.remove('bounce'), 300);
                    }, stopDelay);
                }

                const maxEndTime = 1.2 + (REEL_COUNT - 1) * 0.15 + 0.2;
                setTimeout(() => {
                    reelStrips.forEach(strip => strip.style.transition = 'none');
                    if (data.scatters >= 3) {
                        // Highlight winning scatters
                        highlightScatters(finalGrid, finalTranslateYs);
                        // Play win sound
                        playWinSound();
                        // Show win overlay
                        showWinOverlay(data.winAmount);
                        // Add container animation
                        gameContainer.classList.add('win-animation');
                        setTimeout(() => gameContainer.classList.remove('win-animation'), 1800);
                        // Spawn confetti (more for bigger wins)
                        const confettiCount = data.scatters >= 5 ? 100 : 50;
                        spawnConfetti(confettiCount);
                    }
                    let msg = "";
                    if (data.scatters >= 3) {
                        msg = `✨ ${data.scatters} scatters! You win $${data.winAmount}`;
                        if (data.freeSpinsAwarded > 0) {
                            msg += ` + ${data.freeSpinsAwarded} free spins!`;
                            playFreeSpinsSound();
                        }
                    } else {
                        msg = "No scatter win. Try again!";
                    }
                    messageDiv.textContent = msg;

                    spinBtn.disabled = false;

                    if (data.freeSpinsRemaining > 0) {
                        setTimeout(() => spin(true), 1500);
                    }
                }, maxEndTime * 1000 + 100);

            } catch (err) {
                console.error('Spin failed', err);
                messageDiv.textContent = 'Network error';
                spinBtn.disabled = false;
            }
        }

        // ===================== EVENT LISTENERS =====================
        spinBtn.addEventListener('click', () => spin(false));

        // ===================== INITIALIZATION =====================
        createReels();
        fetchState();
    </script>
</body>
</html>
