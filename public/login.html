<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In – YOUR TV</title>
  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }

    body{
      font-family:Arial,sans-serif; min-height:100vh; color:#fff;
      display:flex; align-items:center; justify-content:center;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.45), rgba(0,0,0,0.92)),
        radial-gradient(circle at top, rgba(229,9,20,0.22) 0%, rgba(20,20,20,0.15) 35%, rgba(0,0,0,1) 75%),
        linear-gradient(to right, #050505, #111, #050505);
      background-attachment: fixed;
    }

    body::before{
      content:""; position:fixed; inset:0;
      background:radial-gradient(circle at top center, rgba(229,9,20,0.16), transparent 55%);
      pointer-events:none; z-index:-1;
    }
    body::after{
      content:""; position:fixed; inset:0;
      background:linear-gradient(to top, rgba(0,0,0,0.75), transparent 30%);
      pointer-events:none; z-index:-1;
    }

    .auth-box{
      position:relative; width:100%; max-width:420px; background:#151515;
      border:1px solid rgba(255,255,255,0.08); border-radius:24px; overflow:hidden;
      box-shadow:0 20px 60px rgba(0,0,0,0.7); animation:popUp .25s ease;
    }

    .auth-header{
      padding:20px 22px; font-size:22px; font-weight:800;
      border-bottom:1px solid rgba(255,255,255,0.06); text-align:center;
    }

    .auth-body{ padding:22px; display:flex; flex-direction:column; gap:14px; }

    .auth-body input{
      width:100%; height:50px; border:none; outline:none; border-radius:14px;
      background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08);
      color:#fff; font-size:15px; padding:0 18px; transition:.25s;
    }
    .auth-body input:focus{
      border-color:#ff003c; box-shadow:0 0 0 3px rgba(255,0,60,0.15);
    }
    .auth-body input::placeholder{ color:#888; }

    .auth-submit{
      width:100%; height:50px; border:none; border-radius:14px;
      background:linear-gradient(135deg,#ff003c,#ff7a00); color:#fff;
      font-weight:bold; font-size:16px; cursor:pointer; transition:.25s;
      box-shadow:0 5px 18px rgba(255,0,60,0.3);
    }
    .auth-submit:hover{ opacity:.9; transform:translateY(-1px); }
    .auth-submit:disabled{ opacity:.6; cursor:not-allowed; }

    .auth-switch{ text-align:center; font-size:13px; color:#aaa; }
    .auth-switch a{ color:#ff5a6a; cursor:pointer; font-weight:600; }
    .auth-switch a:hover{ text-decoration:underline; }

    .auth-error{ color:#ff5a5a; font-size:13px; text-align:center; min-height:20px; }
    .back-home{ margin-top:10px; text-align:center; }
    .back-home a{ color:#888; font-size:12px; text-decoration:none; }
    .back-home a:hover{ color:#fff; }

    /* ── Header integration ── */
    .nf-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(10, 10, 10, .7);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-icon-btn {
      width: 38px;
      height: 38px;
      border: none;
      background: rgba(255, 255, 255, .04);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all .2s;
      text-decoration: none;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, .06);
    }
    .header-icon-btn:hover {
      background: rgba(255, 255, 255, .12);
      transform: scale(1.05);
      border-color: rgba(255, 255, 255, .15);
    }
    .header-icon-btn .nx-icon {
      font-size: 22px;
      opacity: .85;
    }

    .play-slots-btn {
      background: #e67e22;
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .play-slots-btn:hover { background: #f39c12; }

    /* Responsive adjustments */
    @media(max-width: 600px) {
      .nf-header { padding: 6px 8px; }
      .auth-box { margin: 80px 12px 20px; }
    }
    @keyframes popUp{ from{ opacity:0; transform:scale(.92); } to{ opacity:1; transform:scale(1); } }
  </style>
</head>
<body>

<!-- Integrated header -->
<header class="nf-header">
  <div class="header-left">
    <button class="header-icon-btn" onclick="history.back()">
      <span class="nx-icon">arrow_back</span>
    </button>
    <a href="index.html" class="header-icon-btn">
      <span class="nx-icon">home</span>
    </a>
  </div>
  <a href="index.html" class="play-slots-btn">🎰 Play Slots</a>
</header>

<div class="auth-box">
  <div class="auth-header">🔐 Sign In</div>
  <div class="auth-body">
    <input type="email" id="loginEmail" placeholder="Email address" />
    <input type="password" id="loginPassword" placeholder="Password" />
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#aaa;cursor:pointer;user-select:none;">
      <input type="checkbox" onchange="document.getElementById('loginPassword').type=this.checked?'text':'password'" style="width:16px;height:16px;accent-color:#ff003c;">
      Show password
    </label>
    <div class="auth-error" id="loginError"></div>
    <button class="auth-submit" id="loginBtn">Sign In</button>
    <div class="auth-switch">
      No account? <a href="signup.html"><b> REGISTER HERE </b></a>
    </div>
    <div class="back-home"><a href="index.html">← Back to Home</a></div>
  </div>
</div>

<script type="module">
  // ========== FIREBASE CONFIG ==========
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAzjmVZUTLMeX1R-W2V86RBKrKP6bgl6iU",
    authDomain: "yourtv-c12eb.firebaseapp.com",
    projectId: "yourtv-c12eb",
    storageBucket: "yourtv-c12eb.firebasestorage.app",
    messagingSenderId: "28690991912",
    appId: "1:28690991912:web:aced74eff2ddd5eaaede1d",
    measurementId: "G-S28R0XLW60"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ========== UI Elements ==========
  const emailEl   = document.getElementById('loginEmail');
  const passEl    = document.getElementById('loginPassword');
  const errorEl   = document.getElementById('loginError');
  const loginBtn  = document.getElementById('loginBtn');

  // ========== LOGIN FUNCTION ==========
  async function handleLogin() {
    const email = emailEl.value.trim();
    const pass  = passEl.value;
    errorEl.innerText = '';

    if (!email || !pass) { errorEl.innerText = 'Please fill in all fields.'; return; }
    if (!email.includes('@')) { errorEl.innerText = 'Enter a valid email address.'; return; }
    if (pass.length < 4) { errorEl.innerText = 'Password is too short.'; return; }

    loginBtn.disabled = true;
    loginBtn.innerText = 'Signing in...';

    try {
      const cred = await signInWithEmailAndPassword(auth, email, pass);
      // Get user data from Firestore for coins / displayName
      const userDoc = await getDoc(doc(db, 'users', cred.user.uid));
      const userData = userDoc.exists() ? userDoc.data() : null;
      const username = cred.user.displayName || email.split('@')[0];
      const coins    = userData?.coins || 0;

      localStorage.setItem('yourtv_session', JSON.stringify({
        username,
        email: cred.user.email,
        uid: cred.user.uid,
        coins
      }));

      // Redirect back to the page they came from (or default to index.html)
      const redirect = new URLSearchParams(window.location.search).get('redirect') || 'index.html';
      window.location.href = redirect;
    } catch (e) {
      if (e.code === 'auth/user-not-found') errorEl.innerText = 'No account with this email.';
      else if (e.code === 'auth/wrong-password') errorEl.innerText = 'Wrong password.';
      else errorEl.innerText = e.message;
      loginBtn.disabled = false;
      loginBtn.innerText = 'Sign In';
    }
  }

  // ========== Event Listeners ==========
  loginBtn.addEventListener('click', handleLogin);
  document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

  // If already logged in, redirect
  onAuthStateChanged(auth, user => {
    if (user) {
      const redirect = new URLSearchParams(window.location.search).get('redirect') || 'index.html';
      window.location.href = redirect;
    }
  });
</script>

</body>
</html>
